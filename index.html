<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>额度池镜像</title>
<style>
:root{--bg:#111317;--panel:#1a1d24;--line:#2a2e38;--acc:#4d8bff;--ok:#34d399;
  --warn:#fbbf24;--bad:#f87171;--mut:#8b93a7;--dim:#5b6272}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#e8eaf0;font-family:-apple-system,PingFang SC,'Microsoft YaHei',sans-serif;
  padding:max(12px,env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));font-size:14px}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:17px;margin-bottom:4px}
.ts{font-size:12px;color:var(--mut);margin-bottom:14px}
.total{background:linear-gradient(135deg,#1e3a8a,#0f5661);border-radius:14px;
  padding:16px 16px 16px 18px;margin-bottom:14px;display:flex;
  justify-content:space-between;align-items:center}
.total b{font-size:30px;font-variant-numeric:tabular-nums}
.total span{font-size:12px;color:#9fc3ff;display:block;margin-top:2px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0}
.icon-btn:active{background:rgba(255,255,255,.25)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
.icon-btn.done{border-color:var(--ok);background:rgba(52,211,153,.2);color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:13px;color:var(--mut);margin:16px 0 8px;letter-spacing:.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}
.row .v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ok)}
.row.low .v{color:var(--bad)}
.row.low .n:after{content:'低';font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px;font-weight:400}
.led{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.led:last-child{border-bottom:0}
.led .l1{display:flex;justify-content:space-between}
.led .l1 .m{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.led .c{color:var(--ok);font-variant-numeric:tabular-nums}
.led .uk{color:var(--dim)}
.err{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;color:var(--mut);text-align:center}
.refresh{display:block;width:100%;margin-top:14px;padding:11px;border:0;border-radius:12px;
  background:var(--acc);color:#fff;font-size:14px;font-weight:600}
.refresh:disabled{opacity:.6}
.hint2{font-size:11.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5}
.refresh.done{background:var(--ok)}
.refresh.spin{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.refresh.done{padding:11px}
.hint2.ok{color:var(--ok)}
h1 .ti{width:18px;height:18px;vertical-align:-3px;color:var(--acc)}
.err.warnbar{display:flex;gap:10px;align-items:center;color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <h1><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.8 9.2c-.5-.7-1.5-1.2-2.8-1.2-1.7 0-3 .9-3 2s1.3 1.8 3 2 3 .9 3 2-1.3 2-3 2c-1.3 0-2.3-.5-2.8-1.2"/></svg> 额度池</h1>
  <div class="ts" id="ts">加载中…</div>
  <div id="content"><div class="err">加载中…</div></div>
  <div class="hint2" id="refreshHint">Mac 端每 20 秒自动同步 · 点右上角图标立即刷新</div>
</div>
<script>
const KEY = new URLSearchParams(location.search).get('k') || '';
const FILE = ['s-', 'ad99ad', '.json'].join('');
let busy = false;

function render(d){
  document.getElementById('ts').textContent =
    '数据时间 ' + d.ts + ' · 同步于 ' + (d.generated || '').slice(11);
  let h = '<div class="total"><div>' +
          '<b>' + d.total.toLocaleString() + '</b> 分' +
          '<span>全部账号 · 可用积分合计</span></div>' +
          '<button class="icon-btn" id="refreshBtn" onclick="load(true)" aria-label="刷新">' +
          '<svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
          '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button></div>';
  h += '<h2>各账号剩余积分</h2><div class="card">' +
    d.balances.map(x => {
      const low = x[1] < 20;
      return '<div class="row' + (low ? ' low' : '') + '"><span class="n">' + x[0] + '</span>' +
             '<span class="v">' + x[1].toLocaleString() + ' 分</span></div>';
    }).join('') + '</div>';
  h += '<h2>最近 30 条消耗</h2><div class="card">' +
    d.ledger.map(x => {
      const uk = x.credit === '未知';
      return '<div class="led"><div class="l1"><span class="m">' + x.acct + '</span>' +
             '<span class="' + (uk ? 'uk' : 'c') + '">' + x.credit + ' 分</span></div>' +
             '<div class="l1"><span class="m">' + x.ts + ' · ' + x.model + '</span></div></div>';
    }).join('') + '</div>';
  if(d.low && d.low.length)
    h += '<div class="err warnbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px;flex:none"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>余额不足 20 分：' + d.low.join('、') + '</span></div>';
  document.getElementById('content').innerHTML = h;
}

const btnEl = () => document.getElementById('refreshBtn');
const hintEl = () => document.getElementById('refreshHint');
const ICON_OK = '<path d="M20 6L9 17l-5-5"/>';

function setBtn(state){
  const b = btnEl(), h = hintEl();
  const svg = document.getElementById('btnIcon');
  b.classList.remove('spin', 'done');
  svg.innerHTML = '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>';
  if(state === 'loading'){
    b.disabled = true; b.classList.add('spin');
    h.textContent = '正在获取最新数据…';
    h.classList.remove('ok');
  }else if(state === 'done'){
    b.disabled = false; b.classList.add('done');
    svg.innerHTML = ICON_OK;   // 换成对勾
    h.textContent = '✓ 已是最新数据';
    h.classList.add('ok');
    setTimeout(() => {
      b.classList.remove('done');
      svg.innerHTML = '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>';
      h.classList.remove('ok');
      h.textContent = 'Mac 端每 20 秒自动同步 · 点右上角图标立即刷新';
    }, 1800);
  }else{
    b.disabled = false;
    h.textContent = 'Mac 端每 20 秒自动同步 · 点右上角图标立即刷新';
    h.classList.remove('ok');
  }
}

async function load(force){
  if(busy) return;
  if(KEY !== 'ad99ad'){
    document.getElementById('content').innerHTML =
      '<div class="err">请从完整链接打开（缺少访问密钥 k 参数）</div>';
    return;
  }
  busy = true;
  setBtn('loading');
  try{
    const r = await fetch('./' + FILE + '?t=' + Date.now(),
                          {cache:'no-store', headers:{'Cache-Control':'no-cache'}});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
    setBtn(force ? 'done' : 'idle');
  }catch(e){
    document.getElementById('content').innerHTML =
      '<div class="err">加载失败：' + e.message + '<br>请稍后点击右上角图标重试</div>';
    setBtn('idle');
  }finally{
    busy = false;
  }
}

load();
setInterval(() => load(), 60000);    // 静默刷新（60s），不干扰按钮状态
</script>
</body>
</html>
