<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>额度池镜像</title>
<style>
:root{--bg:#111317;--panel:#1a1d24;--line:#2a2e38;--acc:#4d8bff;--ok:#34d399;
  --warn:#fbbf24;--bad:#f87171;--mut:#8b93a7;--dim:#5b6272}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#e8eaf0;font-family:-apple-system,PingFang SC,'Microsoft YaHei',sans-serif;
  padding:max(12px,env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));font-size:14px}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:17px;margin-bottom:4px}
.ts{font-size:12px;color:var(--mut);margin-bottom:14px}
.total{background:linear-gradient(135deg,#1e3a8a,#0f5661);border-radius:14px;
  padding:16px 16px 16px 18px;margin-bottom:14px;display:flex;
  justify-content:space-between;align-items:center}
.total b{font-size:30px;font-variant-numeric:tabular-nums}
.total span{font-size:12px;color:#9fc3ff;display:block;margin-top:2px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0}
.icon-btn:active{background:rgba(255,255,255,.25)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
.icon-btn.done{border-color:var(--ok);background:rgba(52,211,153,.2);color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:13px;color:var(--mut);margin:16px 0 8px;letter-spacing:.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{font-weight:600}
.row .v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ok)}
.row.low .v{color:var(--bad)}
.row.low .n:after{content:'低';font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px;font-weight:400}
.led{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.led:last-child{border-bottom:0}
.led .l1{display:flex;justify-content:space-between}
.led .l1 .m{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.led .c{color:var(--ok);font-variant-numeric:tabular-nums}
.led .uk{color:var(--dim)}
.err{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;color:var(--mut);text-align:center;line-height:1.6}
.hint2{font-size:11.5px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.5}
.hint2.ok{color:var(--ok)}
h1 .ti{width:18px;height:18px;vertical-align:-3px;color:var(--acc)}
.err.warnbar{display:flex;gap:10px;align-items:center;color:var(--warn)}
/* 诊断面板：手机端定位「卡在哪一步」用，纯本地渲染，不依赖任何外部资源 */
.diag{margin-top:18px;background:#0d0f13;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.diag .dh{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line)}
.diag .dh b{font-size:12px;font-weight:600;color:#e8eaf0}
.diag .dh .ver{font-size:10.5px;color:var(--dim);margin-right:auto}
.diag .dh button{border:1px solid var(--line);background:#20242c;color:#cdd3e0;
  font-size:11.5px;border-radius:7px;padding:4px 9px;cursor:pointer}
.diag .dh button:active{background:#2a303a}
.diag pre{margin:0;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;line-height:1.55;color:#9aa4b8;max-height:44vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
.diag pre .bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.8 9.2c-.5-.7-1.5-1.2-2.8-1.2-1.7 0-3 .9-3 2s1.3 1.8 3 2 3 .9 3 2-1.3 2-3 2c-1.3 0-2.3-.5-2.8-1.2"/></svg> 额度池</h1>
  <div class="ts" id="ts">等待数据…</div>
  <div id="content"><div class="err">正在加载…<br><span style="font-size:12px;color:var(--dim)">每一步的结果都会写进下面的诊断日志</span></div></div>
  <div class="hint2" id="refreshHint">Mac 端分时段自动同步 · 点右上角图标立即刷新</div>

  <div class="diag">
    <div class="dh">
      <b>诊断日志</b><span class="ver" id="ver"></span>
      <button id="retryBtn" type="button">重新加载</button>
      <button id="copyBtn" type="button">复制</button>
    </div>
    <pre id="log"></pre>
  </div>
</div>
<script>
'use strict';
var PAGE_VERSION = 'v3 · 11-16 11:05';
var KEY = new URLSearchParams(location.search).get('k') || '';
var FILE = ['s-', 'ad99ad', '.json'].join('');
var HINT_IDLE = 'Mac 端分时段自动同步 · 点右上角图标立即刷新';
// 取数源：同源优先；GitHub Pages 在国内移动网络下常挂起，jsDelivr 分区镜像兜底。
// 注意 cdn.jsdelivr.net 主域在本网络已不可达，所以只列分区镜像。
var SOURCES = [
  {label: '同源 Pages   ', base: '.'},
  {label: 'CDN testingcf', base: 'https://testingcf.jsdelivr.net/gh/Kotlin2022/pool-mirror@main'},
  {label: 'CDN fastly   ', base: 'https://fastly.jsdelivr.net/gh/Kotlin2022/pool-mirror@main'},
  {label: 'CDN gcore    ', base: 'https://gcore.jsdelivr.net/gh/Kotlin2022/pool-mirror@main'}
];
var TIMEOUT = 8000;
var bestSrc = 0, busy = false, retried = false;
var T0 = (window.performance && performance.now) ? performance.now() : Date.now();
var LOGS = [];

function clock(){
  var n = ((window.performance && performance.now) ? performance.now() : Date.now()) - T0;
  return (n / 1000).toFixed(1) + 's';
}
function log(msg){
  LOGS.push('[' + clock() + '] ' + msg);
  var el = document.getElementById('log');
  if(el){ el.textContent = LOGS.join('\n'); el.scrollTop = el.scrollHeight; }
}
function since(t){ return Math.round(((window.performance && performance.now) ? performance.now() : Date.now()) - t); }

function render(d){
  document.getElementById('ts').textContent =
    '数据时间 ' + d.ts + ' · 同步于 ' + (d.generated || '').slice(11);
  var h = '<div class="total"><div>' +
          '<b>' + (d.total || 0).toLocaleString() + '</b> 分' +
          '<span>全部账号 · 可用积分合计</span></div>' +
          '<button class="icon-btn" id="refreshBtn" onclick="load(true)" aria-label="刷新">' +
          '<svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
          '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button></div>';
  h += '<h2>各账号剩余积分</h2><div class="card">' +
    (d.balances || []).map(function(x){
      var low = x[1] < 20;
      return '<div class="row' + (low ? ' low' : '') + '"><span class="n">' + x[0] + '</span>' +
             '<span class="v">' + x[1].toLocaleString() + ' 分</span></div>';
    }).join('') + '</div>';
  h += '<h2>最近 30 条消耗</h2><div class="card">' +
    (d.ledger || []).map(function(x){
      var uk = x.credit === '未知';
      return '<div class="led"><div class="l1"><span class="m">' + x.acct + '</span>' +
             '<span class="' + (uk ? 'uk' : 'c') + '">' + x.credit + ' 分</span></div>' +
             '<div class="l1"><span class="m">' + x.ts + ' · ' + x.model + '</span></div></div>';
    }).join('') + '</div>';
  if(d.low && d.low.length)
    h += '<div class="err warnbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px;flex:none"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>余额不足 20 分：' + d.low.join('、') + '</span></div>';
  document.getElementById('content').innerHTML = h;
}

function btnEl(){ return document.getElementById('refreshBtn'); }
function hintEl(){ return document.getElementById('refreshHint'); }
var ICON_REFRESH = '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>';
var ICON_OK = '<path d="M20 6L9 17l-5-5"/>';

function setBtn(state){
  var b = btnEl();
  if(!b) return;                         // 首屏还没渲染出按钮，直接跳过（不能抛异常）
  var svg = document.getElementById('btnIcon');
  var h = hintEl();
  b.classList.remove('spin', 'done');
  if(svg) svg.innerHTML = ICON_REFRESH;
  if(state === 'loading'){
    b.disabled = true; b.classList.add('spin');
    h.textContent = '正在获取最新数据…'; h.classList.remove('ok');
  }else if(state === 'done'){
    b.disabled = false; b.classList.add('done');
    if(svg) svg.innerHTML = ICON_OK;
    h.textContent = '已是最新数据'; h.classList.add('ok');
    setTimeout(function(){
      b.classList.remove('done');
      if(svg) svg.innerHTML = ICON_REFRESH;
      h.classList.remove('ok'); h.textContent = HINT_IDLE;
    }, 1800);
  }else{
    b.disabled = false; h.textContent = HINT_IDLE; h.classList.remove('ok');
  }
}

async function fetchJSON(url, ms){
  var c = new AbortController();
  var t = setTimeout(function(){ c.abort(); }, ms || TIMEOUT);
  try{
    var r = await fetch(url, {cache: 'no-store', signal: c.signal,
                              headers: {'Cache-Control': 'no-cache'}});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    var txt = await r.text();
    var d;
    try{ d = JSON.parse(txt); }
    catch(e){ throw new Error('返回的不是 JSON（前 40 字：' + txt.slice(0, 40).replace(/\s+/g, ' ') + '）'); }
    return {d: d, bytes: txt.length};
  }finally{
    clearTimeout(t);
  }
}

async function load(force){
  if(force) retried = false;
  if(busy){ log('忽略一次重复请求（上一次还没结束）'); return; }
  if(KEY !== 'ad99ad'){
    document.getElementById('content').innerHTML =
      '<div class="err">请从完整链接打开（缺少访问密钥 k 参数）</div>';
    log('k 参数不匹配，已中止取数');
    return;
  }
  busy = true;
  setBtn('loading');
  var order = [bestSrc].concat(SOURCES.map(function(_, i){ return i; }).filter(function(i){ return i !== bestSrc; }));
  var ok = false, lastErr = null;
  log('开始取数，共 ' + SOURCES.length + ' 个源，单个超时 ' + (TIMEOUT / 1000) + 's');
  for(var k = 0; k < order.length; k++){
    var i = order[k], s = SOURCES[i];
    var url = s.base + '/' + FILE + '?t=' + Date.now();
    var t = (window.performance && performance.now) ? performance.now() : Date.now();
    log('尝试 ' + s.label + ' → ' + url.replace(/\?.*/, ''));
    try{
      var res = await fetchJSON(url, TIMEOUT);
      var d = res.d;
      log('成功 ' + s.label + ' · ' + since(t) + 'ms · ' + res.bytes + 'B · ' +
          ((d.balances || []).length) + ' 个账号 · 合计 ' + d.total);
      bestSrc = i;
      render(d);
      setBtn(force ? 'done' : 'idle');
      ok = true; retried = false;
      break;
    }catch(e){
      lastErr = e;
      var why = (e && e.name === 'AbortError') ? ('超过 ' + (TIMEOUT / 1000) + 's 无响应（多半被网络挡了）')
                                                : (e && e.message ? e.message : String(e));
      log('失败 ' + s.label + ' · ' + since(t) + 'ms · ' + why);
    }
  }
  if(!ok){
    var msg = lastErr ? ((lastErr.name === 'AbortError') ? '请求超时' : (lastErr.message || '网络错误')) : '所有数据源均不可达';
    document.getElementById('content').innerHTML =
      '<div class="err">加载失败：' + msg +
      '<br>GitHub 与 CDN 都没连上，多为手机网络受限' +
      '<br><span style="font-size:12px;color:var(--dim)">下方诊断日志可直接复制反馈</span></div>';
    setBtn('idle');
    log('全部数据源失败：' + msg);
    if(!retried){
      retried = true;
      log('15 秒后自动重试一次');
      setTimeout(function(){ load(); }, 15000);
    }
  }
  busy = false;
}

document.getElementById('ver').textContent = PAGE_VERSION;
document.getElementById('retryBtn').onclick = function(){ log('手动触发重新加载'); load(true); };
document.getElementById('copyBtn').onclick = function(){
  var text = LOGS.join('\n');
  var b = document.getElementById('copyBtn');
  var old = b.textContent;
  function done(t){ b.textContent = t; setTimeout(function(){ b.textContent = old; }, 1500); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done('已复制'); },
                                            function(){ fallbackCopy(text, done); });
  }else{
    fallbackCopy(text, done);
  }
};
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done('已复制'); }catch(e){ done('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}

// 首屏环境信息：这几行是排查「谁挡住了请求」的关键
log('页面版本 ' + PAGE_VERSION);
log('地址 ' + location.href.replace(/([?&]k=)[^&]*/, '$1***'));
log('密钥 k ' + (KEY ? ('已携带 ' + KEY.length + ' 位') : '缺失'));
log('浏览器 ' + String(navigator.userAgent).slice(0, 110));
var conn = navigator.connection || {};
log('网络 ' + (conn.effectiveType || '未知') + (conn.downlink ? (' / ' + conn.downlink + 'Mbps') : '') +
    (navigator.onLine === false ? ' · 离线' : ''));
log('fetch ' + (typeof fetch === 'function' ? '可用' : '不可用（浏览器过旧）'));
log('本地缓存时间 ' + new Date().toLocaleString());

load();
setInterval(function(){ load(); }, 60000);
</script>
</body>
</html>
